# Project-wide Gradle settings
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Resource optimization (aapt2 optimize --shorten-resource-paths) renames raw resources to
# short paths like res/xxx.txt, making the license files under res/raw/ unreadable and
# unverifiable via "unzip -l | grep -i license". AGP 8.10 removed the standalone path-shortening
# switch, so resource optimization is disabled entirely (R8 resource shrinking + keep.xml
# retention of licenses are kept).
android.enableResourceOptimizations=false
