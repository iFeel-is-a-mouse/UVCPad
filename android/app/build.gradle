plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.github.ifeel.uvcpad'
    compileSdk 36

    defaultConfig {
        applicationId "com.github.ifeel.uvcpad"
        minSdk 28
        targetSdk 36
        versionCode 5
        versionName "0.2.12"
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Release is signed with the debug key temporarily (no production keystore)
            signingConfig signingConfigs.debug
        }
    }

    splits {
        abi {
            // Release builds: arm64-only slim variant (with R8 shrinking, outputs app-arm64-v8a-release.apk);
            // Debug builds: full universal APK (outputs app-debug.apk, all ABIs)
            def buildRelease = gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') }
            enable buildRelease
            reset()
            include "arm64-v8a"
            universalApk false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        abortOnError false
        // [uvcpad-lint] ChromeOsAbiSupport: the release variant is intentionally arm64-only (slim
        // APK for the target tablets); shipping x86_64 for ChromeOS is a design decision we reject.
        disable 'ChromeOsAbiSupport'
    }

    // [uvcpad-rotate-test] JVM unit tests run on Robolectric with the app's real resources
    // (strings/theme parsed from res/), so the rotation tests need no device/emulator/capture card.
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.18.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    // AUSBC 3.6.0 (ernestp/AndroidUSBCamera, Apache 2.0) — via JitPack
    implementation 'com.github.ernestp.AndroidUSBCamera:libausbc:3.6.0'

    // [uvcpad-rotate-test] JVM unit tests (no device/emulator):
    // - Robolectric runs the real Android framework classes at SDK 28 (= minSdk, @Config(sdk = [28]))
    // - androidX test core provides ApplicationProvider
    // - Mockito 5 ships the inline mock maker by default, required for final classes
    //   (BluetoothHidDevice/BluetoothDevice) used by the end-to-end HID tests
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
    testImplementation 'org.mockito:mockito-core:5.14.2'
}
